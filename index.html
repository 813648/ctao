<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagem Espacial Relaxante</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #starfield {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let w, h;
        const stars = [];
        const numStars = 400; 

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                z: Math.random() * w
            });
        }

        function animate() {
            // Um fundo com transparência ligeiramente menor (0.1 em vez de 0.2) 
            // também ajuda a criar um rasto mais longo e suave
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, w, h);
            
            const cx = w / 2;
            const cy = h / 2;
            
            ctx.fillStyle = '#ffffff';
            
            for(let i = 0; i < stars.length; i++) {
                let s = stars[i];
                
                // VELOCIDADE ALTERADA AQUI: de 4 para 0.5 para um efeito relaxante
                s.z -= 0.5; 
                
                if(s.z <= 0) {
                    s.x = Math.random() * w;
                    s.y = Math.random() * h;
                    s.z = w;
                }
                
                let k = 128.0 / s.z;
                let px = (s.x - cx) * k + cx;
                let py = (s.y - cy) * k + cy;
                
                let radius = (1 - s.z / w) * 1.5; // Raio ligeiramente menor para maior delicadeza
                
                if(px >= 0 && px <= w && py >= 0 && py <= h) {
                    ctx.beginPath();
                    ctx.arc(px, py, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
