<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagem Espacial</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #starfield {
            display: block; /* Remove margens invisíveis do canvas */
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let w, h;
        const stars = [];
        const numStars = 400; // Quantidade de estrelas

        // Ajusta o tamanho do canvas ao ecrã
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Inicializar estrelas com posições 3D (x, y, z)
        for(let i = 0; i < numStars; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                z: Math.random() * w
            });
        }

        // Animação
        function animate() {
            // Fundo escuro com ligeira transparência para deixar rasto de movimento
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, w, h);
            
            const cx = w / 2;
            const cy = h / 2;
            
            ctx.fillStyle = '#ffffff';
            
            for(let i = 0; i < stars.length; i++) {
                let s = stars[i];
                s.z -= 4; // Velocidade da viagem
                
                // Reposiciona a estrela no fundo quando passa pela "câmera"
                if(s.z <= 0) {
                    s.x = Math.random() * w;
                    s.y = Math.random() * h;
                    s.z = w;
                }
                
                // Perspetiva 3D para 2D
                let k = 128.0 / s.z;
                let px = (s.x - cx) * k + cx;
                let py = (s.y - cy) * k + cy;
                
                // Aumenta o tamanho da estrela à medida que se aproxima
                let radius = (1 - s.z / w) * 2;
                
                // Desenha a estrela se estiver dentro do ecrã
                if(px >= 0 && px <= w && py >= 0 && py <= h) {
                    ctx.beginPath();
                    ctx.arc(px, py, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
